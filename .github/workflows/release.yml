name: Build & Release

on:
  push:
    branches: [main]      # test build on every push: you see right away whether the app builds
    tags: ["v*"]          # build + publish the Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          V="$(tr -d ' \n' < VERSION)"
          grep -q "^VERSION=\"$V\"" bin/checkin-reminder
          bash -n bin/checkin-reminder
          bash -n install.sh
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Tests
        run: /bin/bash tests/run.sh

      - name: Build CheckinNotifier.app (universal)
        run: bash scripts/build-notifier.sh "$RUNNER_TEMP/out" --universal

      - name: Prepare the assets
        run: |
          cd "$RUNNER_TEMP/out"
          ditto -c -k --keepParent CheckinNotifier.app CheckinNotifier.zip
          cd "$GITHUB_WORKSPACE"
          git archive --format=zip --prefix=checkin-reminder/ -o "$RUNNER_TEMP/out/checkin-reminder-$V.zip" HEAD
          awk -v v="$V" '$0 ~ "^## "v {f=1; next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/out/CheckinNotifier.zip" "$RUNNER_TEMP/out/checkin-reminder-$V.zip" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/out/CheckinNotifier.zip" "$RUNNER_TEMP/out/checkin-reminder-$V.zip" \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
